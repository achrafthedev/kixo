<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Kixo · Logging in</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07080a;
        color: #eef0f3;
        font: 16px/1.5 Inter, 'Segoe UI', system-ui, sans-serif;
        text-align: center;
        padding: 20px;
      }
      .logo {
        font-size: 48px;
        font-weight: 900;
        letter-spacing: -2px;
        color: #53fc18;
      }
      p {
        color: #aeb5c1;
        max-width: 420px;
        margin: 10px auto;
      }
      a {
        color: #53fc18;
      }
      .err {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">kixo</div>
      <p id="msg">Returning to Kixo…</p>
      <p id="sub"></p>
    </main>
    <script>
      // Kick redirects here after login; hand the code to the Kixo desktop app,
      // which is listening on localhost and finishes the PKCE exchange itself.
      const q = new URLSearchParams(location.search)
      const msg = document.getElementById('msg')
      const sub = document.getElementById('sub')
      const state = q.get('state') || ''
      history.replaceState(null, '', '/auth/callback')
      if (state.startsWith('h.')) {
        // Kixo ≥ 1.0.4: hand the code to the app through kixo.app (the app polls
        // for it), so no localhost redirect that browsers/firewalls can block.
        const body = q.get('code') ? { state, code: q.get('code') } : { state, error: q.get('error_description') || q.get('error') || 'cancelled' }
        const send = (tries) =>
          fetch('/auth/handoff', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true })
            .then((r) => {
              if (!r.ok) throw new Error(r.status)
            })
            .catch((e) => (tries > 0 ? new Promise((r) => setTimeout(r, 800)).then(() => send(tries - 1)) : Promise.reject(e)))
        msg.textContent = body.code ? 'Finishing login…' : 'Login was cancelled.'
        send(3).then(
          () => {
            if (body.code) {
              msg.textContent = '✅ You\'re logged in!'
              sub.textContent = 'Go back to Kixo, you can close this tab.'
              setTimeout(() => window.close(), 2500)
            } else {
              msg.className = 'err'
              sub.textContent = 'You can close this tab and try again from Kixo.'
            }
          },
          () => {
            msg.className = 'err'
            msg.textContent = 'Could not reach Kixo\'s login service.'
            sub.textContent = 'Check your internet connection and try logging in again.'
          }
        )
      } else if (q.get('error')) {
        msg.className = 'err'
        msg.textContent = 'Login was cancelled or failed.'
        sub.textContent = q.get('error_description') || q.get('error')
      } else if (q.get('code') && q.get('state')) {
        // Kixo ≤ 1.0.3: hand the code to the app's localhost listener.
        const target = 'http://localhost:53682/callback?' + new URLSearchParams({ code: q.get('code'), state })
        location.replace(target)
        setTimeout(() => {
          msg.textContent = 'If nothing happens, make sure Kixo is open, then try logging in again.'
          sub.innerHTML = 'Don\'t have Kixo yet? <a href="/#download">Download it here</a>.'
        }, 3000)
      } else {
        msg.textContent = 'Nothing to do here.'
        sub.innerHTML = '<a href="/">Go to kixo.app</a>'
      }
    </script>
  </body>
</html>
