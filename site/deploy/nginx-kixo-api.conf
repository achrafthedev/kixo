# /etc/nginx/snippets/kixo-api.conf — included from the kixo.app server block.
# Relay for the hosted OBS overlay (kixo.app/overlay?channel=...). Kick's realtime
# servers only accept kick.com as Origin, so the browser connects through here.
# Rate-limit zones live in /etc/nginx/conf.d/kixo-ratelimit.conf (http context).

location = /overlay {
    add_header Cache-Control "no-cache" always;
    try_files /overlay/index.html =404;
}

# Channel info (chatroom id, sub badges) for a validated slug
location ~ "^/api/channel/(?<kslug>[a-z0-9_-]{1,40})$" {
    limit_req zone=kixo_api burst=20 nodelay;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $kick_ch https://kick.com/api/v2/channels/$kslug;
    proxy_pass $kick_ch;
    proxy_ssl_server_name on;
    proxy_set_header Host kick.com;
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36";
    proxy_set_header Accept application/json;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60" always;
}

# Anonymous (guest) realtime token
location = /api/rt/token {
    limit_except POST { deny all; }
    limit_req zone=kixo_api burst=10 nodelay;
    client_max_body_size 1k;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $kick_tok https://web.kick.com/api/v1/realtime/auth/connection;
    proxy_pass $kick_tok;
    proxy_ssl_server_name on;
    proxy_set_header Host web.kick.com;
    proxy_set_header Origin https://kick.com;
    proxy_set_header Referer https://kick.com/;
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36";
    proxy_set_header Content-Type application/json;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store" always;
}

# WebSocket pass-through to Kick's Centrifugo
location = /rt {
    limit_req zone=kixo_ws burst=10 nodelay;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $kick_rt https://realtime.us-east-1.platform.kick.com/connection/websocket;
    proxy_pass $kick_rt;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host realtime.us-east-1.platform.kick.com;
    proxy_set_header Origin https://kick.com;
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36";
    proxy_set_header Cookie "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
