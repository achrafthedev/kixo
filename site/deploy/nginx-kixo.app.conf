# /etc/nginx/sites-available/kixo.app  (static site in /var/www/kixo)
# HTTPS is added by: certbot --nginx -d kixo.app -d www.kixo.app --redirect
# (.app is HSTS-preloaded: browsers only ever load it over HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name kixo.app www.kixo.app;

    if ($host = www.kixo.app) {
        return 301 https://kixo.app$request_uri;
    }

    root /var/www/kixo;
    include snippets/kixo-api.conf;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Showcase streamer live status / followers (resolved per request so a DNS
    # hiccup can never stop nginx from starting)
    location = /api/ces4rrs {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $kick https://kick.com/api/v2/channels/ces4rrs;
        proxy_pass $kick;
        proxy_ssl_server_name on;
        proxy_set_header Host kick.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36";
        proxy_set_header Accept application/json;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=30" always;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
